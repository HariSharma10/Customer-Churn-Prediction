{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card shadow-sm border-0 text-center p-5">
            <h3 class="text-danger mb-3">Something Went Wrong</h3>
            <p class="text-muted">We couldn't process that prediction. Please check your inputs and try again.</p>
            <p class="text-muted small">{{ error }}</p>
            <a href="/predict" class="btn btn-primary mt-3">Back to Prediction Form</a>
        </div>
    </div>
</div>

{% endblock %}
